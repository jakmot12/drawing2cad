[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drawing2cad"
version = "0.1.0"
description = "Rysunek techniczny 2D (wektorowy PDF) -> zweryfikowany model 3D (STEP)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "cadquery>=2.4",
    "pymupdf>=1.24",
    "scipy>=1.11",
    "numpy>=1.26",
    "fonttools>=4.40",
    "openai>=1.40",
    "anthropic>=0.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.5", "httpx>=0.27"]
app = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "pywebview>=5.0"]

[project.scripts]
drawing2cad = "drawing2cad.cli:main"
drawing2cad-app = "drawing2cad.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"drawing2cad.app" = ["static/*.*", "static/vendor/three/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
